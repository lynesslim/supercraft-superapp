name: Automated Website Health & Integrity Monitor

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      daily_summary:
        description: 'Send daily consolidated summary email'
        required: false
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r monitoring/requirements.txt

      - name: Determine if Daily Summary Run
        id: check_summary
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ github.event.inputs.daily_summary }}" = "true" ] || [ "$HOUR" = "00" ]; then
            echo "send_summary=--daily-summary" >> $GITHUB_OUTPUT
          else
            echo "send_summary=" >> $GITHUB_OUTPUT
          fi

      - name: Run Website Health Monitor
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.hostinger.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          python monitoring/monitor.py ${{ steps.check_summary.outputs.send_summary }}

